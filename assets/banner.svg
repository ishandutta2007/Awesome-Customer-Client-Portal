<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a1024" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .tech-grid {
        stroke: #334155;
        stroke-opacity: 0.25;
        stroke-width: 1;
      }
      .orb-pulse-1 {
        animation: orbPulse1 9s ease-in-out infinite alternate;
      }
      .orb-pulse-2 {
        animation: orbPulse2 11s ease-in-out infinite alternate;
      }
      .float-card-1 {
        animation: floatAnim1 7s ease-in-out infinite;
      }
      .float-card-2 {
        animation: floatAnim2 8s ease-in-out infinite;
      }
      .badge-glow {
        animation: badgePulse 3.5s ease-in-out infinite alternate;
      }
      .signal-wave {
        animation: waveTravel 4s linear infinite;
      }

      @keyframes orbPulse1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        100% { transform: translate(60px, 40px) scale(1.25); opacity: 0.55; }
      }
      @keyframes orbPulse2 {
        0% { transform: translate(0px, 0px) scale(1.1); opacity: 0.25; }
        100% { transform: translate(-50px, -30px) scale(0.9); opacity: 0.45; }
      }
      @keyframes floatAnim1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatAnim2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(12px); }
      }
      @keyframes badgePulse {
        0% { stroke-opacity: 0.35; filter: drop-shadow(0 0 2px #38bdf8); }
        100% { stroke-opacity: 0.9; filter: drop-shadow(0 0 10px #818cf8); }
      }
      @keyframes waveTravel {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Subtle Background Orbs (Non-obstructing, behind everything) -->
  <g opacity="0.6">
    <circle class="orb-pulse-1" cx="200" cy="120" r="160" fill="url(#glowGrad1)" />
    <circle class="orb-pulse-2" cx="1020" cy="280" r="190" fill="url(#glowGrad2)" />
  </g>

  <!-- High-Tech Background Grid -->
  <g class="tech-grid">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />

    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Dynamic Side Graphic 1: Floating Portal Stats Card (Safe margin at left) -->
  <g class="float-card-1" transform="translate(60, 240)">
    <rect width="170" height="90" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" filter="url(#dropShadow)" />
    <circle cx="28" cy="30" r="12" fill="#0284c7" fill-opacity="0.3" />
    <circle cx="28" cy="30" r="6" fill="#38bdf8" />
    <text x="50" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">CLIENT VAULT</text>
    <text x="50" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Encrypted 256-bit</text>
    <path d="M 28 65 L 142 65" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <path d="M 28 65 L 115 65" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" class="signal-wave" />
  </g>

  <!-- Dynamic Side Graphic 2: Floating Activity Card (Safe margin at right) -->
  <g class="float-card-2" transform="translate(970, 80)">
    <rect width="170" height="90" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1.2" filter="url(#dropShadow)" />
    <circle cx="28" cy="30" r="12" fill="#9333ea" fill-opacity="0.3" />
    <circle cx="28" cy="30" r="6" fill="#c084fc" />
    <text x="50" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">STATUS</text>
    <text x="50" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Self-Hosted Hub</text>
    <text x="28" y="70" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">● 100% White-Label</text>
  </g>

  <!-- Main Center Header Group (Foreground - Unobstructed & High Contrast) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Category Pill Badge -->
    <g class="badge-glow">
      <rect x="-180" y="-30" width="360" height="34" rx="17" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="1.5" />
      <circle cx="-150" cy="-13" r="5" fill="#38bdf8" />
      <text x="8" y="-10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      Customer &amp; Client Portal
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="115" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.2">
      Self-Hosted Workspaces, Secure Client Vaults &amp; White-Label SaaS
    </text>

    <!-- Sub-tagline description -->
    <text x="0" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      The definitive index of client collaboration, document sharing, and agency portals
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🔒 Secure Vaults</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-75, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🏷️ White-Label</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ Open-Source</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(235, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">💼 Top SaaS</text>
      </g>
    </g>
  </g>

  <!-- Bottom Border Highlight Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
